<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormFlow{% block title %}{% endblock %}</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="mode-{{ ui_mode }}">
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <span class="brand-icon" aria-hidden="true">FF</span>
      <span class="brand-name">FormFlow</span>
      <span class="mode-pill {{ 'mode-pill-dev' if is_dev_mode else 'mode-pill-prod' }}">{{ 'Dev' if is_dev_mode else 'Desk' }}</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
      <a href="/cases" class="{{ 'active' if request.path.startswith('/cases') else '' }}">Cases</a>
      <a href="/needs-attention" class="{{ 'active' if request.path == '/needs-attention' else '' }}">Needs Attention</a>
      {% if is_dev_mode %}
      <a href="/profiles" class="{{ 'active' if request.path.startswith('/profiles') else '' }}">Profiles</a>
      <a href="/queue" class="{{ 'active' if request.path.startswith('/queue') else '' }}">Queue</a>
      <a href="/healthz">Health</a>
      {% endif %}
    </nav>

    <div class="header-right">
      <form method="post" action="/ui-mode" class="mode-switch-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="mode" value="{{ 'production' if is_dev_mode else 'dev' }}">
        <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}">
        <button type="submit" class="mode-switch-btn" title="Switch between simple Desk UI and full Developer diagnostics">
          {{ 'Desk Mode' if is_dev_mode else 'Dev Mode' }}
        </button>
      </form>
    </div>
  </div>
</header>

<main class="page-main">{% block content %}{% endblock %}</main>
<div id="ff-toast" class="toast-banner" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
